services:
  nginx:
      image: nginx:latest

      container_name: nest_nginx

      restart: always

      ports:
        - '8080:80'

      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      depends_on:
        - app
      networks:
        - app_network

  app:
    build: .
    expose:
      - "3000"

    # container_name: nest_app

    # ports:
    #   - '5000:3000'

    depends_on:
      - postgres
      - redis

    networks:
      - app_network

    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/nestdb
      REDIS_HOST: redis
      REDIS_PORT: 6379



    # networks:
    #   - app_network

  

  postgres:
    image: postgres:16

    container_name: nest_postgres

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nestdb

    ports:
      - '5435:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network

  redis:
    image: redis:7

    container_name: nest_redis
    networks:
      - app_network

    restart: always

    ports:
      - '6380:6379'

    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog
    container_name: nest_mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network: 
    driver: bridge