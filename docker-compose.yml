services:
  nginx:
      image: nginx:latest

      container_name: nest_nginx

      restart: always

      ports:
        - '8080:80'

      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      depends_on:
        - app
      networks:
        - app_network

  app:
    build: .

    command: npm run start:dev

    volumes:
      - .:/app
      - /app/node_modules

    expose:
      - "3000"

    # container_name: nest_app

    # ports:
    #   - '5000:3000'

    depends_on:
      - postgres
      - redis

    networks:
      - app_network

    environment:
      UV_THREADPOOL_SIZE: "16"
      DATABASE_URL: postgresql://admin:secret@postgres:5432/nestdb?connection_limit=20
      REDIS_HOST: redis
      REDIS_PORT: 6379



    # networks:
    #   - app_network

  

  postgres:
    image: postgres:16

    container_name: nest_postgres

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nestdb

    ports:
      - '5435:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network

  redis:
    image: redis:7

    container_name: nest_redis
    networks:
      - app_network

    restart: always

    ports:
      - '6380:6379'

    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog
    container_name: nest_mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: nest_prometheus
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app_network
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: nest_grafana
    restart: always
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_network
    depends_on:
      - prometheus


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app_network: 
    driver: bridge